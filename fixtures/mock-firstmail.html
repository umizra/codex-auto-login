<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Firstmail</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      form { display: grid; gap: 12px; }
      .hidden { display: none; }
      .message { margin-top: 16px; padding: 12px; background: #eef3ff; }
    </style>
  </head>
  <body>
    <h1>Mock Firstmail</h1>
    <form id="login-form">
      <label>
        Email
        <input type="email" name="email" autocomplete="username" aria-label="email" />
      </label>
      <label id="password-label" class="hidden">
        Password
        <input type="password" name="password" autocomplete="current-password" aria-label="password" />
      </label>
      <button type="submit" id="submit-button">Next</button>
    </form>
    <div class="message hidden" id="result">Fallback mailbox verified.</div>
    <script>
      const form = document.getElementById('login-form');
      const passwordLabel = document.getElementById('password-label');
      const result = document.getElementById('result');
      const submitButton = document.getElementById('submit-button');
      let stage = 0;

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        stage += 1;
        if (stage === 1) {
          passwordLabel.classList.remove('hidden');
          submitButton.textContent = 'Login';
          return;
        }
        result.classList.remove('hidden');
        document.body.dataset.verified = 'true';
      });
    </script>
  </body>
</html>
